server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 100M;

    location = /hub {
        proxy_pass http://mercure.railway.internal:80/.well-known/mercure;
    
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Proto https;
    
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    
        chunked_transfer_encoding off;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Railway healthcheck: renders the Studio entry page through PHP, so a deploy whose
    # Symfony container does not boot never replaces the running one.
    location = /healthz {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /pimcore-studio/;
        fastcgi_param HTTPS on;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Railway terminates TLS at its edge; tell PHP the public scheme is https
        fastcgi_param HTTPS on;

        fastcgi_read_timeout 300;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
